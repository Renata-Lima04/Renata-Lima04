<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Snake da Renata</title>
  <style>
    :root { --bg:#0f1226; --fg:#e6e6e6; --acc:#2ea043; --grid:#1b1f3a; }
    * { box-sizing: border-box; }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
      display:flex; min-height:100dvh; align-items:center; justify-content:center; padding:16px;
    }
    .wrap {
      width: min(92vw, 520px);
    }
    h1 { margin:0 0 8px; font-size:clamp(20px, 4vw, 28px); text-align:center; }
    .bar {
      display:flex; align-items:center; justify-content:space-between;
      margin:8px 0 12px; gap:8px; font-weight:600;
    }
    .badge { background:var(--grid); padding:6px 10px; border-radius:10px; }
    canvas {
      width:100%; aspect-ratio:1/1; border-radius:14px;
      background:
        linear-gradient(90deg, transparent 24%, var(--grid) 25%, var(--grid) 26%, transparent 27%) 0 0/20px 20px,
        linear-gradient(     transparent 24%, var(--grid) 25%, var(--grid) 26%, transparent 27%) 0 0/20px 20px,
        #0b0e22;
      image-rendering: pixelated;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .keys {
      display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-top:12px;
    }
    .keys button {
      background:#161b33; color:#d7d7d7; border:1px solid #2b315d; border-radius:12px;
      padding:12px 10px; font-size:16px; font-weight:700; cursor:pointer;
      transition:.15s transform ease, .15s background ease;
    }
    .keys button:active { transform: scale(.98); background:#1c2142; }
    .keys .wide { grid-column: span 3; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🐍 Snake da Renata</h1>
    <div class="bar">
      <div class="badge">🎯 Pontos: <span id="score">0</span></div>
      <div class="badge">⚡ Velocidade: <span id="speed">Normal</span></div>
    </div>
    <canvas id="game" width="400" height="400" aria-label="Jogo Snake"></canvas>

    <!-- Controles para celular -->
    <div class="keys" aria-hidden="false">
      <button data-k="ArrowUp">▲</button>
      <button data-k="ArrowLeft">◀</button>
      <button data-k="ArrowRight">▶</button>
      <button data-k="ArrowDown">▼</button>
      <button class="wide" id="restart">🔁 Reiniciar</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');

    const size = 20;           // tamanho do grid
    const cells = canvas.width / size;

    let snake, dir, food, score, speed, loop;

    function init() {
      snake = [{x:10, y:10}];
      dir = {x:1, y:0};
      score = 0;
      speed = 120; // ms (menor = mais rápido)
      placeFood();
      scoreEl.textContent = score;
      speedEl.textContent = "Normal";
      clearInterval(loop);
      loop = setInterval(tick, speed);
      draw();
    }

    function placeFood() {
      food = {
        x: Math.floor(Math.random()*cells),
        y: Math.floor(Math.random()*cells)
      };
      // evita spawn em cima da cobra
      if (snake.some(s => s.x === food.x && s.y === food.y)) placeFood();
    }

    function tick() {
      // move a cabeça
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      // teleporte nas bordas (wrap)
      head.x = (head.x + cells) % cells;
      head.y = (head.y + cells) % cells;

      // colisão com o próprio corpo
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // comeu?
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        // acelera a cada 5 pontos
        if (score % 5 === 0 && speed > 60) {
          speed -= 10;
          speedEl.textContent = "Rápido";
          clearInterval(loop);
          loop = setInterval(tick, speed);
        }
        placeFood();
      } else {
        snake.pop(); // anda
      }

      draw();
    }

    function draw() {
      // fundo (limpa)
      ctx.clearRect(0,0,canvas.width,canvas.height);

      // desenha comida
      ctx.fillStyle = '#2ea043';
      ctx.fillRect(food.x*size, food.y*size, size, size);

      // desenha cobra
      for (let i=0; i<snake.length; i++) {
        ctx.fillStyle = i === 0 ? '#58a6ff' : '#3b82f6';
        ctx.fillRect(snake[i].x*size, snake[i].y*size, size, size);
      }
    }

    function gameOver() {
      clearInterval(loop);
      ctx.fillStyle = 'rgba(0,0,0,.65)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 10);
      ctx.font = '16px system-ui';
      ctx.fillText('Pressione Reiniciar ou R para jogar de novo', canvas.width/2, canvas.height/2 + 18);
    }

    // Controles
    window.addEventListener('keydown', e => {
      const k = e.key;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)) {
        // impede reversão imediata
        if (k==='ArrowUp'    && dir.y!== 1) dir = {x:0, y:-1};
        if (k==='ArrowDown'  && dir.y!==-1) dir = {x:0, y: 1};
        if (k==='ArrowLeft'  && dir.x!== 1) dir = {x:-1, y:0};
        if (k==='ArrowRight' && dir.x!==-1) dir = {x: 1, y:0};
      }
      if (k==='r' || k==='R') init();
    });

    document.querySelectorAll('[data-k]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const k = btn.getAttribute('data-k');
        window.dispatchEvent(new KeyboardEvent('keydown', {key:k}));
      });
    });
    document.getElementById('restart').addEventListener('click', init);

    init();
  </script>
</body>
</html>
